# Concord runtime configuration. Secrets never go here: they live in .env only.

llm:
  # Thinking level per role ("low" | "medium" | "high").
  think:
    planner: high
    generator: high
    critic: high
    tool_selection: medium
    judge: low  # reads a short text summary of residual statistics
    summary: low
    report: low
  # Per-request timeout in seconds, by thinking level.
  timeout_s: {low: 95, medium: 180, high: 300}
  max_retries: 5
  backoff_s: 2.0                   # connection errors: 2, 4, 8 ... s, so a dead endpoint is reported within a minute
  busy_backoff_s: 15.0             # 429/5xx (Cloudflare 524: a request queued 100 s): 15, 30 ... 240 s; with 3 retries
                                   # and 2 s on 2026-10-22, five agent runs failed while the endpoint was loaded
  max_concurrency: 2

# Generator–critic loop
critic:
  max_rounds: 3

# Cross-technique check tolerances (C1–C7)
checks:
  C1_phase:
    xrd_weak_rel_intensity: 0.05   # XRD weak if the strongest indexed peak is below this fraction of the pattern's intensity range
    pdf_good_rw: 0.25              # PDF fit considered good below this Rw
    lattice_warn_rel: 0.003        # refined lattice vs the database value of the phase
  C2_bond_length:
    warn_A: 0.02
    fail_A: 0.05
  C3_coordination:
    warn_abs: 1.0
    fail_abs: 2.0
    extra_min_sigma: 3.0           # a shell missing from the model (e.g. Pt-O) counts if N > 3 sigma ...
    extra_min_rfactor_drop: 0.3    # ... and adding it cuts the EXAFS R-factor by at least 30 %
  C4_oxidation:
    warn_abs: 0.5
    fail_abs: 1.0
    # Metallic models (formal valence 0), calibrated 2026-10-22 on the dev split (dataset_big val + faults, s0060 and up):
    # the XANES valence of clean metals and alloys is 0.05 +- 0.055, at most 0.16 (alloying raises the white line).
    metal_warn_abs: 0.2
    metal_fail_abs: 0.25
    # Mixed valence: |BVS - formal| is at most 0.009 for clean dev samples of every system; the XANES edge must move the
    # same way by more than its typical error.
    bvs_shift_min: 0.03
    xanes_shift_min: 0.1
  C5_disorder:
    # EXAFS sigma2 is expected to be smaller than the PDF pair width because neighbours move together.
    ratio_low: 0.3
    ratio_high: 1.3
  C6_size:
    warn_rel: 0.25
    fail_rel: 0.5
  C7_joint:
    min_margin: 0.02               # combined-score margin needed to call a winner

# Visual-inspection loop
vision:
  max_iterations: 3
  durbin_watson_min: 1.0           # below this the residual is structured (misfit), on independent points
  exafs_rfactor_max: 0.05          # EXAFS fit R-factor accepted up to this
  xrd_area_explained_min: 0.5      # best XRD phase must explain this share of the fitted peak area
  xrd_peak_min: 0.15               # residual peak (share of the data maximum) reported as unexplained; dev split
                                   # (2026-10-22): 1/44 clean patterns, 5/5 wrong phases, 5/5 multi-domain, 4/5 mislabeled
