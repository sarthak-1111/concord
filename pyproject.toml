[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concord"
version = "0.1.0"
description = "Multi-technique (XRD + PDF + XAFS) characterization agent with cross-technique checks"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "lmfit",
    "pymatgen",
    "ase",
    "diffpy.structure",
    "diffpy.srfit",
    "diffpy.srreal",
    "xraylarch",
    "xraydb",
    "pyyaml",
    "python-dotenv",
    "pydantic",
    "requests",
    "matplotlib",
    "starlette",
    "uvicorn",
    "debyecalculator>=1.1.1",
    "torch>=2.14.1",
    "google-adk==1.12.0",
    "sentence-transformers>=6.1.0",
    "faiss-cpu>=1.15.1",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["concord*"]

[project.scripts]
concord = "concord.cli:main"

[tool.uv]
# Supply-chain guard: only resolve releases at least two weeks old.
exclude-newer = "2026-10-08T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs FEFF or a full fit (still part of the default run)", "live: needs the LLM endpoint"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
